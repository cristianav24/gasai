# Nginx para GasAI en tandix.app — colócalo en /etc/nginx/sites-available/tandix.app
# y enlázalo: ln -s /etc/nginx/sites-available/tandix.app /etc/nginx/sites-enabled/
#
# Ruta del proyecto asumida: /var/www/gasai (ajústala si usas otra).
# Certbot añadirá/gestionará el bloque HTTPS al correr:
#   sudo certbot --nginx -d tandix.app -d www.tandix.app

server {
    listen 80;
    listen [::]:80;
    server_name tandix.app www.tandix.app;

    root /var/www/gasai/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20M;   # subidas (imágenes de conocimiento, etc.)

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # No servir archivos ocultos (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
