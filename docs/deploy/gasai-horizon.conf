; Supervisor para mantener Horizon (colas) corriendo.
; Colócalo en /etc/supervisor/conf.d/gasai-horizon.conf y luego:
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start gasai-horizon

[program:gasai-horizon]
process_name=%(program_name)s
command=php /var/www/gasai/artisan horizon
directory=/var/www/gasai
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/gasai/storage/logs/horizon.log
stopwaitsecs=3600
